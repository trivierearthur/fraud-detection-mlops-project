name: MLOps - Monitoring and Retraining

on:
  workflow_dispatch:

jobs:
  monitor-and-retrain:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate monthly simulation data
        run: python src/simulate_months.py

      - name: Monitor monthly data and retrain on drift
        shell: bash
        run: |
          for month in {1..12}
          do
            echo ""
            echo "======================================"
            echo "Processing month $month"
            echo "======================================"

            python src/monitoring.py --month $month

            if [ $? -eq 1 ]; then
              echo "Drift detected for month $month."
              echo "Starting automatic model retraining..."

              python src/retrain.py

              echo "Retraining completed."
            else
              echo "No drift detected for month $month."
              echo "Keeping current model."
            fi
          done

      - name: Show generated model versions
        run: |
          echo "Generated model versions:"
          ls -lh models/