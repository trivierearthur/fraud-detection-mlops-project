name: MLOps - Monitoring and Retraining

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Retrain monthly even without detected drift, per the brief's "after a
    # given time (one month) or after the incoming data has changed" rule.
    - cron: "0 3 1 * *"

jobs:
  monitor-and-retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: just test

      - name: Generate monthly simulation data
        run: just simulate

      - name: Monitor 12 months and retrain on drift
        shell: bash
        run: |
          set -u

          echo "======================================"
          echo "MLOps monthly monitoring simulation"
          echo "======================================"

          for month in $(seq 1 12)
          do
            MONTH=$(printf "%02d" "$month")

            echo ""
            echo "======================================"
            echo "Processing month $MONTH"
            echo "======================================"

            set +e

            just monitor-month "$month"
            STATUS=$?

            set -u

            if [ "$STATUS" -eq 1 ]; then
              echo ""
              echo ">>> Drift detected for month $MONTH"
              echo ">>> Updating training data"

              cp "data/monthly/month_${MONTH}.csv" data/raw/fraud_data.csv

              echo ">>> Starting automatic retraining"
              just retrain

              echo ">>> Retraining completed for month $MONTH"

            elif [ "$STATUS" -eq 0 ]; then
              echo ""
              echo ">>> No drift detected for month $MONTH"
              echo ">>> Keeping current model"

            else
              echo ""
              echo ">>> Monitoring failed for month $MONTH"
              exit "$STATUS"
            fi
          done

      - name: Validate latest model artifact
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import joblib

          models_dir = Path("models")
          current_file = models_dir / "current_model.txt"

          if not current_file.exists():
              raise SystemExit("current_model.txt was not created")

          model_name = current_file.read_text(
              encoding="utf-8"
          ).strip()

          model_path = models_dir / model_name

          if not model_path.exists():
              raise SystemExit(
                  f"Model not found: {model_path}"
              )

          joblib.load(model_path)

          print(f"Current model: {model_name}")
          print("Latest model loaded successfully.")
          PY

      - name: Verify the retrained model is reachable over the API
        env:
          API_KEY: ${{ secrets.API_KEY }}
        shell: bash
        run: |
          set -e

          uv run python src/api.py &
          API_PID=$!

          echo "Waiting for the API to become available..."
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/health > /dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -sf http://127.0.0.1:5000/health > /dev/null; then
            echo "API never became reachable."
            kill "$API_PID" || true
            exit 1
          fi

          echo "API is up. Scoring a sample transaction against the retrained model..."

          RESPONSE=$(curl -sf -X POST http://127.0.0.1:5000/predict \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{
              "trans_date_trans_time": "01-01-2025 12:30",
              "merchant": "Test Merchant",
              "category": "grocery_pos",
              "amt": 50.0,
              "city": "Test City",
              "state": "CA",
              "lat": 40.0,
              "long": -75.0,
              "city_pop": 100000,
              "job": "Analyst",
              "dob": "01-01-1990",
              "trans_num": "CI123",
              "merch_lat": 40.1,
              "merch_long": -75.1
            }')

          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep -q "fraud_probability"

          kill "$API_PID"

      - name: Show generated model versions
        run: |
          echo "Generated model versions:"
          ls -lh models/fraud_model_v*.joblib
